<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>학습 리포트</title>

<!-- 파비콘 & 앱 아이콘 -->
<link rel="icon" type="image/svg+xml" href="img/icon/favicon.svg">
<link rel="icon" type="image/png" sizes="96x96" href="img/icon/favicon-96x96.png">
<link rel="shortcut icon" href="img/icon/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="img/icon/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">

<!-- CDN 라이브러리 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<!-- 스타일 -->
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/report.css">
<style>
  .hw-li { color: #6b7280; }
  .hw-li.s2,
  .hw-li.s1,
  .hw-li.s0 { color: #222; }
</style>
</head>
<body>

<!-- ════ 패널 (A 영역) ════ -->
<div class="panel">
  <div class="panel-head">
    <div class="panel-brand">
      <div class="panel-brand-left">
        <span class="panel-logo">📝</span>
        <h2 class="panel-title">학습 리포트</h2>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;">
        <span id="rLastSaved" class="panel-saved"></span>
        <span id="unsavedInline" class="unsaved-inline" style="display:none;">⚠ 미저장</span>
      </div>
    </div>
    <div class="sbar-row">
      <div id="sbar" class="sbar idle" onclick="triggerLoad()" style="flex:1;">📂 엑셀 파일 불러오기</div>
      <button id="btnExcelRemove" class="sbar-remove-btn" onclick="removeExcelData()" style="display:none;" title="엑셀 데이터 제거">−</button>
    </div>
    <input type="file" id="excelInput" accept=".xlsx,.xls" style="display:none" onchange="loadExcel(this)">
    <button id="btnZeroStart" class="btn-zero-start" onclick="zeroStart()">또는 직접 시작하기 →</button>
  </div>

  <!-- 뷰 탭 (숨김) -->
  <div class="view-tabs" id="viewTabs" style="display:none!important;"></div>
  <div class="tab-bar" id="tabBar" style="display:none!important;"></div>

  <div class="panel-body">
    <div id="viewDate" style="display:none;">
      <!-- 수업 요약 카드 -->
      <div id="dateSummary" class="date-summary"></div>

      <!-- 과제 섹션 -->
      <div class="panel-section">
        <div class="panel-card">
          <div class="cg" id="gPrevHw">
            <label>저번 주차 과제 <span class="ab">자동</span></label>
            <div id="hwEditor" style="display:flex;flex-direction:column;gap:4px;"></div>
            <div class="rate-input-row">
              <span class="rate-label">이행률</span>
              <input type="number" id="inputRate" class="rate-input" min="0" max="100" oninput="onRateManual()">
              <span class="rate-unit-sm">%</span>
              <button class="ab rate-auto-btn" onclick="autoCalcRate()" title="과제 상태에서 이행률을 자동 계산합니다" style="margin-left:auto;">⚡ 자동계산</button>
            </div>
          </div>
        </div>
        <div class="panel-card">
          <div class="cg" id="gCurHw">
            <label>이번 주차 과제 <span class="ab">자동</span> <span class="label-hint">(학생별 추가 가능)</span></label>
            <div id="curHwList" style="display:flex;flex-direction:column;gap:3px;overflow:hidden;"></div>
            <div id="extraHwEditor" style="display:flex;flex-direction:column;gap:3px;"></div>
            <div class="hw-add-extra">
              <input type="text" id="extraHwInput" placeholder="추가 과제 입력" onkeydown="if(event.key==='Enter')addExtraHw()">
              <button onclick="addExtraHw()">+ 추가</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 선택 항목 섹션 -->
      <div class="panel-section">
        <div class="sw-row" id="toggleMini" onclick="toggleSec('mini')">
          <div class="sw-track"><div class="sw-thumb"></div></div>
          <div style="flex:1;">
            <div class="sw-label">📝 미니 테스트</div>
            <div class="sw-desc">리포트에 테스트 결과 포함</div>
          </div>
        </div>
        <div id="gMini" style="display:none;flex-direction:column;gap:8px;">
          <div class="panel-card">
            <div class="cg">
              <label>오답 번호 <span class="label-hint">(쉼표 구분)</span></label>
              <input type="text" id="inputWrong" placeholder="오답 번호 입력" oninput="updateWrongTags(this.value)">
            </div>
          </div>
        </div>

        <!-- 코멘트 (임시 숨김) -->
        <div class="sw-row" id="toggleComment" onclick="toggleSec('comment')" style="display:none;">
          <div class="sw-track"><div class="sw-thumb"></div></div>
          <div style="flex:1;">
            <div class="sw-label">💬 코멘트</div>
            <div class="sw-desc">선생님 한마디 포함</div>
          </div>
        </div>
        <div class="cg" id="gComment" style="display:none;">
          <div style="font-size:11px;color:#9ca3af;padding:2px 0;">리포트에서 직접 편집하세요</div>
        </div>
        <input type="hidden" id="inputTeacher">
        <input type="hidden" id="inputComment">
        <button class="btn-s" id="btnMemo" onclick="openMemo()" style="display:none;">📋 비고 작성하기</button>
      </div>
    </div>
  </div>

  <!-- hidden inputs -->
  <input type="hidden" id="inCurBook">
  <input type="hidden" id="inCurChap">
  <input type="hidden" id="inCurDetail">
  <input type="hidden" id="inPrevBook">
  <input type="hidden" id="inPrevChap">
  <input type="hidden" id="inPrevDetail">
  <input type="hidden" id="inputNotice">
  <input type="number" id="inputCorrect" style="display:none;">
  <input type="number" id="inputTotal" style="display:none;">
  <div id="calcResult" style="display:none;"></div>
</div>

<!-- 패널 리사이즈 핸들 -->
<div class="panel-resize" id="panelResize"></div>

<!-- ════ 미리보기 (B 영역) ════ -->
<div class="preview" id="previewArea">
  <!-- 상단 메뉴 바 -->
  <div class="toolbar">
    <div style="display:flex;flex-direction:column;gap:4px;"></div>
    <div class="tb-group">
      <button class="tb-btn" disabled title="준비 중">🖨 프린트</button>
      <button class="tb-btn" id="btnPdf" onclick="dlPdf()" style="display:none;">📄 PDF로 내보내기</button>
      <button class="tb-btn tb-save tb-main" id="btnSave" onclick="saveToExcel()" style="display:none" disabled>💾 저장</button>
      <div class="tb-sep"></div>
      <div class="tb-dropdown" id="tbMenu">
        <button class="tb-btn" onclick="toggleToolbarMenu('tbMenu')">☰ 메뉴</button>
        <div class="tb-menu">
          <div class="tb-sub">
            <button class="tb-sub-trigger">👥 학생 관리 <span class="tb-arrow">‹</span></button>
            <div class="tb-sub-list">
              <button onclick="openAddStudentModal();closeToolbarMenus()">➕ 학생 추가</button>
              <button onclick="openRemoveStudentModal();closeToolbarMenus()">➖ 학생 제거</button>
              <div class="tb-menu-sep"></div>
              <button onclick="openStudentSettingsModal();closeToolbarMenus()">⚙ 학생 설정</button>
            </div>
          </div>
          <div class="tb-sub">
            <button class="tb-sub-trigger">📊 리포트 모아보기 <span class="tb-arrow">‹</span></button>
            <div class="tb-sub-list">
              <button onclick="dlClassJournal();closeToolbarMenus()">📝 수업 일지</button>
              <button onclick="dlStudentReport();closeToolbarMenus()">📊 이행률 요약표 (학생별)</button>
              <button onclick="dlGradeSummary();closeToolbarMenus()">📊 이행률 요약표 (전체)</button>
              <div class="tb-menu-sep"></div>
              <button onclick="dlSummaryPdf();closeToolbarMenus()">📋 전체 과제 요약 이미지</button>
            </div>
          </div>
          <div class="tb-menu-sep"></div>
          <button onclick="openBatchPdfModal();closeToolbarMenus()">📄 일괄 PDF</button>
        </div>
      </div>
      <div class="tb-sep"></div>
      <div class="tb-dropdown" id="tbSettings">
        <button class="tb-btn" onclick="toggleToolbarMenu('tbSettings')">⚙ 설정</button>
        <div class="tb-menu">
          <button onclick="openLessonModal();closeToolbarMenus()">📋 수업 진도 설정</button>
          <div class="tb-menu-sep"></div>
          <div style="padding:8px 14px 6px;font-size:11px;font-weight:700;color:#8a8f9e;">리포트 테마</div>
          <button id="btnColorMode" onclick="toggleColorMode();closeToolbarMenus()">🌙 흑백 모드</button>
          <div class="tb-menu-sep"></div>
          <button class="tb-menu-ver-btn" onclick="showUpdateModal();closeToolbarMenus()">🔄 업데이트 확인 (v1.70)</button>
        </div>
      </div>
      <button class="tb-btn tb-help-btn" onclick="openHelpModal()" title="도움말">?</button>
    </div>
  </div>
  <div class="preview-body">
    <!-- 메인 콘텐츠 -->
    <div class="preview-content" id="previewContent">
      <!-- 상단 날짜 네비게이션 -->
      <div class="date-nav-bar" id="dateNavBar" style="display:none;">
        <button class="dn-arrow" onclick="navDatePrev()">‹</button>
        <div class="dn-label" id="dnLabel" onclick="toggleDateDropdown()"></div>
        <button class="dn-arrow" onclick="navDateNext()">›</button>
        <button class="dn-add" onclick="addDateFromNav()" title="날짜 추가">+</button>
        <div class="dn-dropdown" id="dnDropdown"></div>
      </div>
      <div class="attend-bar" id="attendBar" style="display:none;">
        <div id="attendToggle" class="attend-toggle">
          <button class="att-btn att-present" data-att="2" onclick="setAttend(2)">출석</button>
          <button class="att-btn att-late" data-att="1" onclick="setAttend(1)">지각</button>
          <button class="att-btn att-absent" data-att="0" onclick="setAttend(0)">결석</button>
        </div>
      </div>
      <div class="page-nav" id="pageNav" style="display:none;">
        <button id="btnPrev" onclick="prevSpread()" disabled>‹</button>
        <span class="pinfo" id="pageInfo">1 / 1</span>
        <button id="btnNext" onclick="nextSpread()" disabled>›</button>
      </div>
      <div class="spread-row" id="spreadRow">
        <div class="page-slot" id="leftSlot">

          <!-- 리포트 카드 -->
          <div class="rc" id="reportCard">
            <div class="rc-header">
              <div class="rc-sname">
                <span id="rName" class="eh" style="display:inline;"></span><span class="suf" style="font-size: inherit; font-weight: inherit; color: inherit; margin-left: 8px;">학생</span>
              </div>
              <div class="rc-meta">
                <div class="rc-date" id="rDate"></div>
              </div>
            </div>

            <!-- ① 이행률 -->
            <div class="sec" id="secRate">
              <div class="sec-title green"><span class="sec-icon">·</span> 숙제 이행률</div>
              <div class="rate-wrap">
                <div class="rate-num"><span id="rRate" class="eh" contenteditable="true">—</span></div>
                <div class="rate-unit">%</div>
              </div>
              <div class="rate-chart">
                <div class="rate-mascot" id="rateMascot"></div>
                <div class="chart-inner"><svg class="lc" id="svgChart" viewBox="0 0 660 100" preserveAspectRatio="none"></svg></div>
                <div class="chart-labels" id="gLabels"></div>
              </div>
            </div>

            <!-- ② 저번 주차 과제 -->
            <div class="sec" id="secPrevHw">
              <div class="sec-title">
                <span class="sec-icon">✎</span> 저번 주차 과제
                <span id="rPrevHwDate" class="prev-hw-date"></span>
              </div>
              <div class="hw-list" id="rHwList"></div>
            </div>

            <!-- ③ 진도 -->
            <div class="sec">
              <div class="sec-title"><span class="sec-icon">📖</span> 수업 진도</div>
              <div class="prog-row">
                <div class="prog-card current">
                  <div class="prog-label">현재 진도 <span id="rCurDt" style="text-transform:none;font-weight:500;"></span></div>
                  <div>
                    <span class="prog-book eh" id="rCurBook" data-panel="inCurBook"></span>
                    <span class="prog-chap eh" id="rCurChap" data-panel="inCurChap"></span>
                  </div>
                  <div class="prog-detail eh" id="rCurDetail" data-panel="inCurDetail"></div>
                </div>
                <div class="prog-card prev">
                  <div class="prog-label">이전 진도 <span id="rPrevDt" style="text-transform:none;font-weight:500;"></span></div>
                  <div>
                    <span class="prog-book eh" id="rPrevBook" data-panel="inPrevBook"></span>
                    <span class="prog-chap eh" id="rPrevChap" data-panel="inPrevChap"></span>
                  </div>
                  <div class="prog-detail eh" id="rPrevDetail" data-panel="inPrevDetail"></div>
                </div>
              </div>
            </div>

            <!-- ④ 이번 과제 -->
            <div class="sec">
              <div class="sec-title">
                <span class="sec-icon">✐</span> 이번 주차 과제
                <span id="rNextHwDate" class="prev-hw-date"></span>
              </div>
              <div class="next-hw-list" id="rNoticeList"></div>
            </div>

            <!-- ⑤ 미니테스트 (선택) -->
            <div class="sec" id="secMini" style="display:none;">
              <div class="sec-title green"><span class="sec-icon">✏</span> 미니 테스트</div>
              <div class="mini-wrong-row">
                <div class="mini-wrong-lbl">✗ 오답 번호</div>
                <div class="mini-tags" id="rWrongTags"></div>
              </div>
              <span id="rCorrect" style="display:none;"></span>
              <span id="rTotal" style="display:none;"></span>
            </div>

            <!-- ⑥ 코멘트 (선택) -->
            <div class="sec" id="secComment" style="display:none;">
              <div class="sec-title"><span class="sec-icon">·</span> 코멘트</div>
              <div class="comment-wrap">
                <div class="comment-text eh" id="commentBody" data-panel="inputComment"></div>
                <div class="teacher-sign eh" id="commentSign"></div>
              </div>
            </div>

          </div><!-- /rc -->

          <canvas id="leftPdfCanvas" style="display:none;box-shadow:0 4px 20px rgba(0,0,0,.1);"></canvas>
          <div class="pdf-lbl" id="leftLabel"></div>
          <button class="pdf-add-inline" id="pdfAddInline" onclick="inlinePdfAttach()" title="PDF 첨부" style="display:none;">+</button>
        </div>

        <div class="page-slot" id="rightSlot" style="display:none;">
          <canvas id="rightPdfCanvas" style="box-shadow:0 4px 20px rgba(0,0,0,.1);"></canvas>
          <div class="pdf-lbl" id="rightLabel"></div>
        </div>
      </div>
      <!-- 확대/축소 컨트롤 -->
      <div class="zoom-ctrl" id="zoomCtrl">
        <button onclick="zoomReport(-0.05)" title="축소">−</button>
        <span id="zoomLevel">auto</span>
        <button onclick="zoomReport(0.05)" title="확대">+</button>
        <button onclick="zoomReport(0)" title="자동 맞춤" style="font-size:10px;width:auto;padding:0 6px;">맞춤</button>
      </div>
      <!-- 학생 전환 화살표 (우측 상하) -->
      <div class="stu-nav-group" id="stuNavGroup" style="display:none;">
        <button class="stu-nav-v stu-nav-up" id="stuNavPrev" onclick="navStudentPrev()">‹</button>
        <button class="stu-nav-v stu-nav-down" id="stuNavNext" onclick="navStudentNext()">›</button>
      </div>
    </div>
    <!-- 날짜 사이드바 (삭제됨, 상단 네비로 대체) -->
    <!-- 학생 사이드바 (맨 우측) -->
    <div class="student-sidebar" id="studentSidebar" style="display:none;">
      <div class="ss-header">학생</div>
      <div class="ss-list" id="ssList"></div>
    </div>
  </div>
  <!-- PDF 파일 입력 (숨김) -->
  <input type="file" id="pdfInput" accept=".pdf" style="display:none;" onchange="handlePdfInput(this)">
</div>

<!-- ════ 수업설정 전체화면 모달 ════ -->
<div class="lm-overlay" id="lessonModalOverlay" style="display:none;">
  <div class="lm-modal lm-full">
    <div class="lm-header">
      <h3>⚙ 수업 진도 설정</h3>
      <div style="display:flex;align-items:center;gap:8px;">
        <button class="btn-s" onclick="addLesson()" style="width:auto;padding:6px 14px;font-size:12px;">➕ 날짜 추가</button>
        <button class="lm-close" onclick="closeLessonModal();if(G.selDate)switchView('date');">✕</button>
      </div>
    </div>
    <div class="lm-body lm-main" style="padding:20px 24px;overflow-y:auto;">
      <div id="lessonCards" style="display:flex;flex-direction:column;gap:12px;"></div>
    </div>
  </div>
</div>

<!-- JS (의존 순서대로 로드) -->
<script src="js/state.js"></script>
<script src="js/utils.js"></script>
<script src="js/db.js"></script>
<script src="js/excel.js"></script>
<script src="js/ui.js"></script>
<script src="js/session.js"></script>
<script src="js/autofill.js"></script>
<!-- 비고 모달 -->
<div class="lm-overlay" id="memoModalOverlay" style="display:none;" onclick="if(event.target===this)closeMemo(false)">
  <div class="lm-modal" style="max-width:560px;">
    <div class="lm-header">
      <h3 id="memoTitle">📋 비고</h3>
      <button class="lm-close" onclick="closeMemo()">✕</button>
    </div>
    <div style="padding:20px 24px;flex:1;display:flex;flex-direction:column;gap:14px;overflow-y:auto;">
      <div id="memoAutoArea" style="display:none;">
        <div style="font-size:11px;font-weight:700;color:#6b7280;margin-bottom:6px;">자동 기록 (이월과제 요약)</div>
        <div id="memoAutoText" style="font-size:13px;color:#555;background:#f8f9fa;border:1px solid #e5e7eb;border-radius:8px;padding:10px 14px;line-height:1.6;white-space:pre-wrap;"></div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;">
        <div style="font-size:11px;font-weight:700;color:#6b7280;margin-bottom:6px;">메모</div>
        <textarea id="memoText" placeholder="추가 메모를 입력하세요..." style="flex:1;min-height:140px;resize:vertical;padding:12px;font-size:14px;font-family:inherit;border:1px solid #d1d6db;border-radius:10px;outline:none;line-height:1.7;"></textarea>
      </div>
      <button class="btn-p" onclick="saveMemo()">저장</button>
    </div>
  </div>
</div>

<script src="js/report.js"></script>
<script src="js/pdf.js"></script>
<script src="js/init.js"></script>

</body>
</html>
